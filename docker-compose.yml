services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: devops-jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - ./volumes/jenkins:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - devops-network
    restart: unless-stopped

  sonarqube:
    image: sonarqube:9.9-community
    container_name: devops-sonarqube
    ports:
      - "9000:9000"
    volumes:
      - ./volumes/sonarqube/data:/opt/sonarqube/data
      - ./volumes/sonarqube/extensions:/opt/sonarqube/extensions
    networks:
      - devops-network
    restart: unless-stopped

  nexus:
    image: sonatype/nexus3:latest
    container_name: devops-nexus
    ports:
      - "8083:8081"
    volumes:
      - ./volumes/nexus:/nexus-data
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms270M -Xmx270M -XX:MaxDirectMemorySize=270M
    networks:
      - devops-network
    restart: unless-stopped

  achat-app:
    build: ./app
    container_name: devops-app
    ports:
      - "8089:8081"
    networks:
      - devops-network
    restart: unless-stopped

  # ============================================
  # PROMETHEUS - Collecte de métriques
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: devops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - devops-network
    restart: unless-stopped

  # ============================================
  # GRAFANA - Visualisation des métriques
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: devops-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - devops-network
    restart: unless-stopped

networks:
  devops-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
